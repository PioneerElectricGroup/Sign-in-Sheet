<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1929">
<meta name="application-name" content="Sign-In Board">
<meta name="apple-mobile-web-app-title" content="Sign-In">
<title>Oyster Sign-In Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E1929'/%3E%3Cpath d='M36 6 16 36h14l-4 22 22-32H34z' fill='%236FA6F2'/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* Oyster Sign-In Board — Pioneer Electric Group. A mounted jobsite kiosk.
   Deliberately single-theme (navy + gray, Pioneer's colours): it runs on a tablet on the
   gang box at 5:45 AM and must not flip to a light ground because someone's OS says so.
   Every colour is painted explicitly so the page holds on any host background. */
:root{
  --ground:#0E1929;      /* deep navy */
  --surface:#162640;
  --surface-2:#20334F;
  --edge:#31476A;
  --ink:#F3F5F8;
  --muted:#9AA9BE;       /* steel gray */
  --accent:#6FA6F2;      /* Pioneer blue, lit for a dark ground */
  --accent-ink:#0E1929;
  --live:#5FD37A;        /* on site — semantic, not brand */
  --live-dim:#173A2C;
  --done:#6E7E97;
  --alert:#F0684A;
  --alert-dim:#3A2320;
  --r:10px;
  --pad:clamp(14px,2.2vw,26px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Barlow,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hd{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;letter-spacing:.01em}
.eyebrow{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);font-weight:500}

.wrap{padding-inline:var(--pad);padding-block:var(--pad) 0;max-width:1500px;margin:0 auto}

/* ---------- header rail ---------- */
.rail{display:flex;align-items:center;gap:clamp(12px,2vw,28px);flex-wrap:wrap;border:1px solid var(--edge);
  border-top:3px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:14px clamp(14px,2vw,22px)}
.job{display:flex;flex-direction:column;gap:2px;min-width:0}
.job b{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:clamp(19px,2.4vw,26px);letter-spacing:.02em;line-height:1.1}
.job span{font-size:13px;color:var(--muted);letter-spacing:.04em}
.clock{margin-left:auto;display:flex;align-items:baseline;gap:10px}
.clock .t{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:clamp(34px,5.6vw,58px);color:var(--ink);line-height:.95;font-variant-numeric:tabular-nums}
.clock .d{font-size:13px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
.railbtns{display:flex;gap:8px;align-items:center}
.chip{border:1px solid var(--edge);border-radius:999px;background:var(--surface-2);padding:9px 15px;font-size:14px;font-weight:600;
  letter-spacing:.03em;color:var(--ink);display:inline-flex;align-items:center;gap:7px;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}
.dot.warn{background:var(--accent)}.dot.bad{background:var(--alert)}

/* ---------- offline banner ---------- */
.offline{margin-top:12px;padding:14px 18px;border-radius:var(--r);background:var(--alert-dim);border:2px solid var(--alert);color:#FFDCD2;font-size:17px;font-weight:600;display:flex;gap:12px;align-items:center}
.offline .dot{width:14px;height:14px;background:var(--alert)}
.findbtn{border:1px dashed var(--edge);border-radius:var(--r);background:transparent;padding:18px 22px;min-height:70px;color:var(--accent);font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-size:clamp(18px,2.2vw,24px);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:clamp(12px,1.6vw,18px)}
.findbtn:hover{border-color:var(--accent)}
.tile.away{background:#121F33;border-color:#28395A}
.tile.away::before{background:var(--done)}
.tile.away .nm{color:#C9D3E3}.tile.away .cta{color:var(--accent)}.tile.away .times{color:var(--muted)}
.tile.away .badge{color:var(--done);border-color:#28395A}
.segs{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.seg .rm{border:1px solid var(--edge);border-radius:9px;min-height:56px;min-width:56px;color:var(--alert);font-size:20px}
.bi{display:block;font-size:.72em;opacity:.75;letter-spacing:.06em;font-weight:500}
.rrow .tm small{display:block;font-size:11px;color:var(--muted);font-family:Barlow,sans-serif}
.sendbar{background:#1B2F4E;border-color:var(--accent);color:#DCE7F7}
.sendbar b{color:#fff}
.sendbar .tag{color:var(--accent);border-color:var(--accent)}
.sendbar button{margin-left:auto;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:10px 20px;min-height:46px;font-weight:700;font-size:15px}
.sendbar.late{border-color:var(--alert)}.sendbar.late .tag{color:var(--alert);border-color:var(--alert)}
/* ---------- strips ---------- */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:10px 16px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--edge);font-size:14px;color:var(--muted)}
.bar strong{color:var(--ink);font-weight:600}
.bar .sep{width:1px;height:16px;background:var(--edge)}
.back{border:1px solid var(--edge);border-radius:999px;padding:8px 16px 8px 12px;min-height:44px;font-weight:600;font-size:15px;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.undo{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:#1B2F4E;border-radius:999px;padding:8px 18px;min-height:44px;font-weight:700;font-size:14px;letter-spacing:.04em}
.missed{margin-top:12px;padding:12px 16px;border-radius:var(--r);background:var(--alert-dim);border:1px solid var(--alert);color:#F6CFC4;font-size:15px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.missed b{color:#FFDCD2;font-weight:700}
.missed .tag{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:12px;border:1px solid var(--alert);border-radius:999px;padding:3px 9px;color:var(--alert)}

/* ---------- agency chooser ---------- */
.agencies{display:grid;gap:clamp(12px,1.6vw,18px);grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:clamp(12px,1.6vw,18px)}
.agency{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--edge);
  border-radius:var(--r);padding:clamp(22px,3vw,34px) clamp(20px,2.6vw,30px);min-height:clamp(200px,30vh,280px);transition:transform .12s ease}
.agency::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:var(--r) 0 0 var(--r);background:var(--accent)}
.agency:active{transform:scale(.985)}
.agency .ag{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:clamp(44px,6.5vw,72px);line-height:1;letter-spacing:.02em}
.agency .cnt{font-size:16px;color:var(--muted)}
.agency .cnt b{color:var(--live);font-weight:700;font-size:20px}
.agency .arrow{margin-top:auto;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:17px;color:var(--accent)}

/* ---------- crew grid ---------- */
.crew{display:grid;gap:clamp(12px,1.6vw,18px);grid-template-columns:repeat(auto-fit,minmax(430px,1fr));margin-top:clamp(12px,1.6vw,18px)}
.crew.small{max-width:1010px}
.tile{position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);
  padding:clamp(16px,2vw,24px) clamp(16px,2vw,24px) clamp(16px,2vw,22px) clamp(22px,2.4vw,30px);min-height:clamp(170px,22vh,220px);transition:transform .12s ease}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:var(--r) 0 0 var(--r);background:var(--edge)}
.tile:active{transform:scale(.985)}
.tile .nm{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:clamp(24px,3.1vw,36px);line-height:1.04;letter-spacing:.01em;text-wrap:balance;padding-right:110px}
.tile .sub{font-size:13px;color:var(--muted);letter-spacing:.05em;margin-top:-6px}
.tile .state{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tile .cta{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:500;font-size:clamp(15px,1.7vw,19px);color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tile .cta .g{font-size:1.15em;line-height:1}
.tile .cta>span:not(.g){display:flex;flex-direction:column;line-height:1.15}
.tile .cta .bi{font-size:.7em;letter-spacing:.05em;text-transform:none;opacity:.8}
.tile .times{font-size:clamp(15px,1.8vw,19px);letter-spacing:.02em;color:var(--ink)}
.tile .times i{font-style:normal;color:var(--muted);padding:0 6px}
.tile .code{font-size:13px;color:var(--muted);letter-spacing:.03em}
.tile.out .cta{color:var(--accent)}
.tile.in{background:linear-gradient(180deg,var(--live-dim),var(--surface) 62%);border-color:#2F6B4A}
.tile.in::before{background:var(--live)}
.tile.in .cta{color:var(--live)}
.tile.done{background:#121F33;border-color:#28395A}
.tile.done::before{background:var(--done)}
.tile.done .nm{color:#B9C4D6}.tile.done .cta{color:var(--done)}.tile.done .times{color:var(--muted)}
.tile.walk{border-style:dashed}
.tile.addw{align-items:center;justify-content:center;text-align:center;border-style:dashed;background:transparent}
.tile.addw::before{display:none}
.tile.addw .nm{padding:0;color:var(--accent);font-size:clamp(22px,2.6vw,30px)}
.tile.addw .sub{color:var(--muted)}
.badge{position:absolute;top:14px;right:14px;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:12px;
  padding:5px 11px;border-radius:999px;border:1px solid var(--edge);color:var(--muted)}
.tile.in .badge{color:var(--accent-ink);background:var(--live);border-color:var(--live)}
.tile.done .badge{color:var(--done);border-color:#28395A}
.tile.walk .badge{color:var(--accent);border-color:var(--accent)}

/* ---------- office strip ---------- */
.office{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;line-height:1.5;margin-top:clamp(14px,2vw,20px);
  padding:14px 4px calc(var(--pad) + 6px);border-top:1px solid var(--edge);font-size:13px;color:var(--muted);letter-spacing:.03em}
.office button{border:1px solid var(--edge);border-radius:8px;padding:10px 16px;min-height:44px;color:var(--muted);font-size:14px;font-weight:600}
.office button:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(6,11,20,.9);display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.veil[hidden]{display:none!important}
.sheet{width:min(760px,100%);max-height:94vh;overflow:auto;background:var(--surface);border:1px solid var(--edge);border-top:4px solid var(--accent);
  border-radius:14px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:18px}
.sheet.wide{width:min(1040px,100%)}
.sheet .foot{position:sticky;bottom:calc(-1*clamp(20px,3vw,32px) - 2px);background:var(--surface);padding-top:10px;padding-bottom:clamp(20px,3vw,32px);margin-top:-6px;margin-bottom:calc(-1*clamp(20px,3vw,32px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -14px 14px -10px rgba(6,11,20,.9)}
.sigwrap{display:flex;flex-direction:column;gap:8px}
.sigtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sigtop>span{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:12px;color:var(--muted);font-weight:500}
.sigtop .linkish{padding:2px 0;min-height:0;align-self:baseline}
.sigpad{display:block;width:100%;height:150px;background:#F4F6FA;border:2px dashed #7B8AA3;border-radius:10px;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.sigpad.inked{border-style:solid;border-color:var(--live)}
.sigattest{font-size:16px;color:var(--ink);line-height:1.35}
.sigview{display:inline-block;width:150px;height:60px;background:#F4F6FA;border-radius:6px;vertical-align:middle}
.sigrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.sigrow b{color:var(--ink);font-weight:600}
.sigrow .nosig{color:var(--alert);font-weight:600}
.sheet .kicker{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.13em;font-weight:500;font-size:14px;color:var(--accent);margin:0}
.sheet .kicker.green{color:var(--live)}
.sheet h2{margin:0;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:clamp(34px,5.4vw,52px);line-height:1;letter-spacing:.01em;text-wrap:balance}
.sheet h2.md{font-size:clamp(26px,3.6vw,34px)}
.stamp{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--edge);border-radius:var(--r);padding:16px 18px}
.stamp .big{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:clamp(32px,5vw,46px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stamp .note{font-size:14px;color:var(--muted)}
.warnband{background:var(--alert-dim);border:1px solid var(--alert);border-radius:var(--r);padding:16px 18px;color:#FFDCD2;font-size:17px;line-height:1.4}
.warnband b{display:block;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--alert);margin-bottom:5px;font-weight:600}
.field{display:flex;flex-direction:column;gap:9px}
.field>span{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:12px;color:var(--muted);font-weight:500}
.finput{width:100%;background:var(--surface-2);color:var(--ink);border:1px solid var(--edge);border-radius:9px;padding:14px 15px;font:inherit;font-size:17px;min-height:56px;-webkit-user-select:text;user-select:text}
.finput::placeholder{color:#6B7C97}
input[type=time].finput{font-family:"Roboto Mono",monospace;font-size:20px}
textarea.finput{min-height:84px;resize:vertical}
.err{color:var(--alert);font-size:14px;font-weight:600;min-height:18px}
.ok{color:var(--live);font-size:14px;font-weight:600;min-height:18px}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.acts button{flex:1 1 210px;min-height:78px;border-radius:10px;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:clamp(17px,2.1vw,21px)}
.acts.tight button{min-height:58px;font-size:16px}
.go{background:var(--live);color:var(--accent-ink)}
.go.blue{background:var(--accent);color:var(--accent-ink)}
.no{background:var(--surface-2);border:1px solid var(--edge);color:var(--muted);flex:0 1 160px}
.no.wide{flex:1 1 210px}
.acts button.dis,button.dis{background:var(--surface-2);border:1px solid var(--edge);color:var(--muted);opacity:1}
.nostore{margin-top:12px;padding:16px 18px;border-radius:var(--r);background:var(--alert-dim);border:2px solid var(--alert);color:#FFDCD2}
.nostore b{display:block;font-family:Oswald,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:19px;line-height:1.25}
.nostore span{display:block;font-weight:500;font-size:15px;line-height:1.45;margin-top:7px;color:#FFD3C6}
.linkish{align-self:flex-start;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:4px;padding:8px 0;min-height:44px}
.linkish.red{color:var(--alert)}
.timeout{height:3px;border-radius:2px;background:var(--edge);overflow:hidden}
.timeout i{display:block;height:100%;background:var(--muted);width:100%}

/* cost-code picker */
.picks{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pick{border:1px solid var(--edge);border-radius:9px;background:var(--surface-2);padding:13px 15px;text-align:left;min-height:64px;display:flex;gap:12px;align-items:center}
.pick .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent-ink)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:#1B2F4E}
.pick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.pick .cd{font-family:"Roboto Mono",monospace;font-weight:700;font-size:17px;letter-spacing:.02em;flex:none;min-width:64px}
.pick .lb{display:flex;flex-direction:column;gap:1px;min-width:0}
.pick .lb b{font-weight:600;font-size:15px;line-height:1.2}
.pick .lb span{font-size:12px;color:var(--muted);line-height:1.2}
.pick .tag{margin-left:auto;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;flex:none}
.codelist{display:flex;flex-direction:column;gap:7px;max-height:38vh;overflow:auto;border:1px solid var(--edge);border-radius:9px;padding:8px;background:#122038}
.codelist .pick{min-height:58px}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-height:34px}
.chips span{font-family:"Roboto Mono",monospace;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 13px}
.chips i{font-style:normal;color:var(--muted);font-size:14px;align-self:center}

/* agency picker (forms) */
.agpick{display:flex;gap:9px;flex-wrap:wrap}
.agpick button{border:1px solid var(--edge);border-radius:9px;background:var(--surface-2);padding:12px 18px;min-height:54px;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:18px;letter-spacing:.03em}
.agpick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#1B2F4E}
.agpick.col{flex-direction:column;align-items:stretch}
.agpick.col button{text-align:left;font-size:16px;text-transform:none;letter-spacing:0;font-family:Barlow,"Helvetica Neue",Arial,sans-serif}

/* suggestions */
.sugg{display:flex;flex-direction:column;gap:7px}
.sugg button{border:1px solid var(--edge);border-radius:9px;background:var(--surface-2);padding:13px 16px;min-height:58px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sugg button b{font-size:18px}
.sugg button span{font-size:13px;color:var(--muted)}

/* ---------- confirmation flash ---------- */
/* Punch confirmation, v13 (Isaac, 9/21): a BAND ACROSS THE TOP, not a full-screen takeover.
   The board stays visible and tappable throughout, so the next man in the queue does not wait.
   pointer-events:none on the strip, re-enabled on Undo only, so a stray tap anywhere else goes
   straight through to the board instead of being eaten by the confirmation. */
.flash{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;justify-content:center;
  padding:10px clamp(10px,2vw,20px);pointer-events:none;animation:drop .18s ease-out}
.flash[hidden]{display:none!important}
@keyframes drop{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.flashin{display:flex;align-items:center;gap:clamp(10px,1.8vw,22px);width:100%;max-width:1500px;
  background:#12321F;border:2px solid var(--live);border-radius:var(--r);padding:12px clamp(12px,2vw,20px);
  box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative;overflow:hidden}
.flash.outk .flashin{background:#132542;border-color:var(--accent)}
.tick{font-size:clamp(30px,4.4vw,44px);line-height:1;color:var(--live);flex:none}
.flash.outk .tick{color:var(--accent)}
.flash h3{margin:0;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;
  font-size:clamp(20px,3.2vw,34px);line-height:1.05;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash .verb{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.14em;font-weight:600;font-size:clamp(11px,1.5vw,14px);color:var(--live)}
.flash.outk .verb{color:var(--accent)}
.flash .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
.flash .at{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;
  font-size:clamp(26px,4.2vw,42px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.flash .codesum{font-family:"Roboto Mono",monospace;font-size:14px;color:var(--muted);flex:none;white-space:nowrap}
.flash .undobig{pointer-events:auto;flex:none;border:2px solid var(--muted);color:var(--ink);border-radius:10px;
  padding:10px 20px;min-height:52px;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;
  text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:14px}
.ring{position:absolute;left:0;right:0;bottom:0;height:4px;background:transparent;overflow:hidden}
.ring i{display:block;height:100%;background:var(--live);width:100%;transform-origin:left center;animation:drain 4s linear forwards}
.flash.outk .ring i{background:var(--accent)}
@media (max-width:760px){ .flash .codesum{display:none} .flash .undobig{padding:10px 14px;font-size:13px} }
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ---------- office: pin + crew + review ---------- */
.pinwrap{width:min(430px,100%);background:var(--surface);border:1px solid var(--edge);border-top:4px solid var(--accent);border-radius:14px;padding:clamp(20px,3vw,30px);display:flex;flex-direction:column;gap:16px;text-align:center}
.pinwrap h2{margin:0;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:26px}
.pinwrap p{margin:0;color:var(--muted);font-size:15px;min-height:22px}
.pinwrap p.bad{color:var(--alert);font-weight:600}
.pips{display:flex;gap:14px;justify-content:center;margin:4px 0 2px}
.pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge);display:block}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:66px;border:1px solid var(--edge);border-radius:10px;background:var(--surface-2);font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.pad button.sm{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pad button:active{background:var(--edge)}

.sect{display:flex;flex-direction:column;gap:9px}
.sect+.sect{margin-top:16px}
.sect>h3{margin:0;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--edge);border-radius:9px;background:var(--surface-2);padding:13px 16px;min-height:62px}
.row .who{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.row .who b{font-size:18px;font-weight:600;line-height:1.2}
.row .who span{font-size:13px;color:var(--muted)}
.row .tagc{font-family:"Roboto Mono",monospace;font-size:15px;font-weight:700;color:var(--accent);border:1px solid var(--edge);border-radius:7px;padding:5px 10px;flex:none}
.row.off{opacity:.55}.row.off .tagc{color:var(--muted)}
.row.pend{border-style:dashed;border-color:var(--accent)}
.addbtn{border:1px dashed var(--edge);border-radius:9px;padding:15px;min-height:60px;color:var(--muted);font-weight:600;font-size:15px;letter-spacing:.03em;width:100%}
.addbtn:hover{color:var(--accent);border-color:var(--accent)}
.stat{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:11px;border:1px solid var(--edge);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap}
.stat.in{color:var(--live);border-color:var(--live)}.stat.ok{color:var(--accent-ink);background:var(--live);border-color:var(--live)}
.stat.ed{color:var(--accent);border-color:var(--accent)}.stat.bad{color:var(--alert);border-color:var(--alert)}
.stat.void{color:var(--muted);text-decoration:line-through}
.daynav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.daynav button{border:1px solid var(--edge);border-radius:9px;background:var(--surface-2);min-height:52px;padding:0 18px;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-size:20px}
.daynav .dl{font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:clamp(18px,2.4vw,24px);text-align:center;flex:1}
.rrow{display:grid;grid-template-columns:minmax(150px,1.6fr) 74px 74px minmax(90px,1.2fr) auto;gap:10px;align-items:center;width:100%;text-align:left;
  border:1px solid var(--edge);border-radius:9px;background:var(--surface-2);padding:11px 14px;min-height:60px}
.rrow.void{opacity:.45}
.rrow .who b{display:block;font-size:16px;font-weight:600;line-height:1.15}
.rrow .who span{font-size:12px;color:var(--muted)}
.rrow .tm{font-family:"Roboto Mono",monospace;font-size:16px;font-variant-numeric:tabular-nums}
.rrow .tm.miss{color:var(--alert);font-weight:700}
.rrow .cds{font-family:"Roboto Mono",monospace;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .sts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.rhead{display:grid;grid-template-columns:minmax(150px,1.6fr) 74px 74px minmax(90px,1.2fr) auto;gap:10px;padding:0 14px;font-family:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted)}
.audit{font-size:13px;color:var(--muted);background:#122038;border:1px solid var(--edge);border-radius:9px;padding:10px 14px;line-height:1.5}
.audit b{color:var(--ink)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:15px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  .clock{margin-left:0;width:100%}.crew{grid-template-columns:1fr}.acts button{flex:1 1 100%}.undo{margin-left:0;width:100%;justify-content:center}
  .two{grid-template-columns:1fr}
  .rrow,.rhead{grid-template-columns:1fr 64px 64px}.rrow .cds,.rhead .h4{display:none}.rrow .sts{grid-column:1/-1;justify-content:flex-start}
}

    db.collection("codes").onSnapshot(function(snap){ var list=[]; snap.docs.forEach(function(doc){ var v=doc.data(); if(v) list.push(Object.assign({code:doc.id},v)); }); list.sort(function(a,b){ return String(a.code)<String(b.code)?-1:1; }); codes=list; LS.set("codes",codes); paint(); if(draft&&!draft.walk) drawSheet(); refreshOffice(); },function(e){ console.error("codes",e&&e.code); });
    db.collection("punches").orderBy("date","desc").limit(120).onSnapshot(function(snap){
      var mine={},open=[],td=today(),rec=[];
      snap.docs.forEach(function(doc){ var v=doc.data(); if(!v) return; rec.push(v); if(v.date===td) mine[doc.id]=v; else { if(isOpen(v)&&!v.voided) open.push(v); var c=LS.get("cache."+v.date,{}); c[doc.id]=v; LS.set("cache."+v.date,c); } });
      open.sort(function(a,b){ return a.date<b.date?1:-1; }); punches=mine; stale=open.slice(0,6); recent=rec; LS.set("recent",rec.slice(0,120)); LS.set("cacheToday",punches); LS.set("cache."+td,punches);
      paint(); if(!document.getElementById("revVeil").hidden&&revDay===td&&!revEdit) loadReview();
    },function(e){ console.error("punches",e&&e.code); });
    db.doc("config/security").get().then(function(doc){ var v=doc&&doc.exists?doc.data():null; if(v&&(v.pins||v.pin)){ SEC=v; LS.set("sec",SEC); } }).catch(function(){});
    db.doc("config/job").get().then(function(doc){ var v=doc&&doc.exists?doc.data():null; if(v&&v.code){ JOB=v; LS.set("job",JOB); paint(); } }).catch(function(){});
  }).catch(function(){ paintSync(); });
})();
</script>
